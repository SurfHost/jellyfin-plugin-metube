<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.45" r="0.9">
      <stop offset="0" stop-color="#1d2747"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </radialGradient>
    <linearGradient id="jf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aa5cc3"/>
      <stop offset="1" stop-color="#00a4dc"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Emblem: a video (play) that drops into your own library (download tray). -->
  <g transform="translate(556 540) scale(1.55)">
    <rect x="-160" y="-160" width="320" height="320" rx="84" fill="url(#jf)"/>
    <g fill="#fff" stroke="#fff" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 -3)">
      <!-- Play triangle. -->
      <path d="M-32,-111 L-32,-23 L46,-67 Z" stroke-width="16"/>
      <!-- Download arrow. -->
      <path d="M0,14 L0,58" fill="none" stroke-width="22"/>
      <path d="M-37,50 L37,50 L0,88 Z" stroke-width="12"/>
      <!-- Tray. -->
      <path d="M-82,60 L-82,102 Q-82,112 -72,112 L72,112 Q82,112 82,102 L82,60" fill="none" stroke-width="19"/>
    </g>
  </g>

  <text x="940" y="532" font-family="Segoe UI, sans-serif" font-weight="700" font-size="176" fill="#ffffff" letter-spacing="-2">MeTube</text>
  <text x="946" y="626" font-family="Segoe UI, sans-serif" font-weight="400" font-size="52" fill="#a9b6d6">Search YouTube, save to Jellyfin</text>
</svg>
