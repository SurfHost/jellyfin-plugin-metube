<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1b21"/>
      <stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <radialGradient id="glow" cx="360" cy="360" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a5cc8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7a5cc8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#AA5CC3"/>
      <stop offset="1" stop-color="#00A4DC"/>
    </linearGradient>
    <linearGradient id="jfText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C27FD8"/>
      <stop offset="1" stop-color="#2BB6E8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <g transform="translate(642 360) scale(1.07) translate(-640 -360)">
    <!-- Emblem -->
    <g transform="translate(360 360)">
      <rect x="-160" y="-160" width="320" height="320" rx="84" fill="url(#jf)" filter="url(#shadow)"/>
      <g fill="#fff" stroke="#fff" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 -3)">
        <!-- play triangle -->
        <path d="M-32,-111 L-32,-23 L46,-67 Z" stroke-width="16"/>
        <!-- download arrow -->
        <path d="M0,14 L0,58" fill="none" stroke-width="22"/>
        <path d="M-37,50 L37,50 L0,88 Z" stroke-width="12"/>
        <!-- tray -->
        <path d="M-82,60 L-82,102 Q-82,112 -72,112 L72,112 Q82,112 82,102 L82,60" fill="none" stroke-width="19"/>
      </g>
    </g>

    <!-- Wordmark -->
    <g font-family="Segoe UI, Segoe UI Semibold, Arial, sans-serif">
      <text x="582" y="366" font-size="140" font-weight="600" fill="#ffffff" letter-spacing="-2">MeTube</text>
      <text x="588" y="452" font-size="64" font-weight="400" fill="url(#jfText)">for Jellyfin</text>
    </g>
  </g>
</svg>
